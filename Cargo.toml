[package]
name = "webx-metrics-pro"
version = "2.0.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["json", "macros", "tokio"] }
askama = "0.12"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time", "sync"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-full", "limit", "set-header", "fs"] }
tower = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
prometheus = "0.13"
axum-prometheus = "0.7"
uuid = { version = "1.10", features = ["v4"] }
anyhow = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "chrono"] }
once_cell = "1.19"
rand = "0.8"
jsonwebtoken = "9.3"
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
password-hash = { version = "0.6", features = ["rand_core"] }
dashmap = "6"
dotenvy = "0.15"
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
