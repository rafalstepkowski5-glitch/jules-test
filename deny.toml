[licenses]
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0"]

[advisories]
# no ignored advisories by default; any advisory will fail the check
ignore = []

[ [bans.crates] ]
# Block specific crates that are not allowed in the org
name = "openssl"

[[bans.crates]]
name = "openssl-sys"

[[bans.crates]]
name = "native-tls"

[multiple-versions]
# Deny multiple versions of the same crate being present
deny = true

[sources]
# Control allowed registries
allow-registry = ["crates-io"]
